name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, Windows, X64, nuc]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests and report coverage
        run: bun test --coverage --timeout 20000 packages/daemon/test packages/ui/test --path-ignore-patterns='**/*.browser.test.ts' --path-ignore-patterns='**/build/**'

      - name: Browser tests
        run: node --test packages/ui/test/command-row.browser.test.ts packages/ui/test/session-window-focus.browser.test.ts packages/ui/test/session-view-lifecycle.browser.test.ts

  native-scroll:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install WebKit
        run: bun node_modules/playwright-core/cli.js install webkit --no-remove

      - name: Test SessionView lifecycle in WebKit
        env:
          TREETOP_TEST_BROWSER: webkit
        run: node --test packages/ui/test/session-view-lifecycle.browser.test.ts

  # Report the test result to Discord from a GitHub-hosted runner. The
  # self-hosted Windows runner has no bash on PATH (only PowerShell 5.1),
  # so the bash-based notify can't run there — release.yml's notify job
  # uses the same ubuntu-latest split. No-op when DISCORD_WEBHOOK isn't
  # configured (e.g. forks).
  notify:
    needs: [test, native-scroll]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ACTOR: ${{ github.actor }}
        run: |
          sha="${{ github.sha }}"
          commit_url="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          commit_msg=$(git log -1 --pretty=%B)
          bun run scripts/notify-discord.ts \
            --title "Tests" \
            --status "${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || needs.test.result }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --author "$ACTOR" \
            --author-url "${{ github.server_url }}/$ACTOR" \
            --author-icon "${{ github.server_url }}/$ACTOR.png" \
            --commit "$commit_msg" \
            --details "Branch \`${{ github.ref_name }}\` · ${{ github.event_name }} · [\`${sha:0:7}\`](${commit_url})" \
            --context "${{ github.workflow }} #${{ github.run_number }}"
